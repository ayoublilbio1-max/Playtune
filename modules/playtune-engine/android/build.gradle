plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.playtuneengine'
version = '1.0.0'

// Media3 1.10.0: stable, built before Media3 moved to Kotlin 2.2 (1.11),
// so it can't clash with the Kotlin version React Native uses.
def media3Version = "1.10.0"

android {
  namespace "expo.modules.playtuneengine"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // Player, queue, gapless playback
  implementation "androidx.media3:media3-exoplayer:${media3Version}"
  // Background service, notification, lock screen, headset / Bluetooth buttons
  implementation "androidx.media3:media3-session:${media3Version}"
  implementation "androidx.media3:media3-common:${media3Version}"

  // Already pulled in by Media3; declared so our code compiles against them directly.
  // Gradle always picks the highest version if another library needs a newer one.
  implementation "com.google.guava:guava:33.3.1-android"
  implementation "androidx.lifecycle:lifecycle-service:2.8.7"
  implementation "androidx.annotation:annotation:1.9.1"
}
